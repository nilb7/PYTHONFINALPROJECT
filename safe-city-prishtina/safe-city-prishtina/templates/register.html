{% extends "base.html" %}
{% block title %}Register - Safe City Prishtina{% endblock %}

{% block content %}
<section class="container section">
    <form method="post" class="card form form-narrow">
        <h1>Register</h1>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username }}" minlength="3" maxlength="30" required autofocus>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required>

        <label for="password">Password (at least 6 characters)</label>
        <input type="password" id="password" name="password" minlength="6" required>

        <label for="confirm">Repeat password</label>
        <input type="password" id="confirm" name="confirm" minlength="6" required>

        <button type="submit" class="btn btn-green">Create account</button>
        <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Login</a>.</p>
    </form>
</section>
{% endblock %}
