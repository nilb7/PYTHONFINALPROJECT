{% extends "base.html" %}
{% block title %}Login - Safe City Prishtina{% endblock %}

{% block content %}
<section class="container section">
    <form method="post" class="card form form-narrow">
        <h1>Login</h1>
        <label for="username">Username or email</label>
        <input type="text" id="username" name="username" value="{{ username }}" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn btn-blue">Login</button>
        <p class="muted">No account yet? <a href="{{ url_for('register') }}">Register here</a>.</p>
        <p class="muted small">Demo account: username <strong>demo</strong>, password <strong>demo123</strong></p>
    </form>
</section>
{% endblock %}
